<meta name="theme-color" content="#FFBE00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="스탬프 투어">
<meta name="application-name" content="스탬프 투어">
<style>
:root{
  --bg:#bfe6f7; --card:#fff; --ink:#15314a; --sub:#5b7590; --line:#d7e6f2;
  --brand:#2f9be0; --brand-2:#f4a11a; --ok:#2bb673; --warn:#e5484d;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:16px 12px 40px}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 2px 6px rgba(20,60,90,.10);margin-bottom:12px}
.hero{background:linear-gradient(135deg,#2f9be0,#57c1f0);color:#fff;border-radius:20px;padding:20px;margin-bottom:12px;text-align:center}
.hero small{opacity:.9;font-weight:700;letter-spacing:.08em;font-size:12px}
.hero h1{margin:4px 0 0;font-size:22px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
input{width:100%;font-size:17px;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none;font-family:inherit}
input:focus{border-color:var(--brand)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:800;cursor:pointer;background:var(--brand);color:#fff;margin-top:14px;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#e6f3fb;color:#1c7ab5}
.btn.small{padding:11px;font-size:14px;margin-top:8px}
.muted{color:var(--sub);font-size:14px}
.err{color:var(--warn);font-size:14px;min-height:20px;margin-top:8px}
.hidden{display:none!important}

/* 상단 고정 바 */
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-radius:16px;padding:10px 14px;box-shadow:0 2px 8px rgba(20,60,90,.12);margin-bottom:10px;display:flex;align-items:center;gap:12px}
.topbar b{font-size:16px}
.topbar .cnt{margin-left:auto;font-weight:900;font-size:20px;color:var(--ok);white-space:nowrap}
.progress{height:10px;background:#e8eff5;border-radius:99px;overflow:hidden;margin-top:8px}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),#5ed99b);transition:width .5s}

/* 게임판 */
.board{position:relative;width:100%;line-height:0;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(20,60,90,.15);background:#bfe6f7}
.board>img.bg{width:100%;height:auto;display:block}
.slot{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:none}
.slot .st{width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:50%;
  opacity:0;transform:scale(2.4) rotate(-25deg);transition:opacity .12s}
.slot.on .st{opacity:1;transform:scale(1) rotate(-8deg)}
.slot.pop .st{animation:stampIn .55s cubic-bezier(.22,1.5,.36,1) forwards}
@keyframes stampIn{0%{opacity:0;transform:scale(2.6) rotate(-28deg)}60%{opacity:1;transform:scale(.88) rotate(-6deg)}100%{opacity:1;transform:scale(1) rotate(-8deg)}}
.slot .st img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.slot .st .fallback{width:100%;height:100%;border-radius:50%;border:5px solid var(--c);background:rgba(255,255,255,.88);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--c);font-weight:900;
  box-shadow:0 2px 4px rgba(0,0,0,.2)}
.slot .st .fallback .e{font-size:26px;line-height:1}
.slot .st .fallback .t{font-size:10px;margin-top:2px;padding:0 4px;text-align:center;word-break:keep-all;line-height:1.1}

/* 남은 부스 목록 */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:6px 11px;
  border-radius:99px;background:#fff;border:1.5px solid #d7e6f2;color:var(--ink)}
.chip.on{background:#e9edf2;border-color:#e9edf2;color:#97a5b5;font-weight:600}
.chip.on .nm{text-decoration:line-through}
.chip .tag{font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:99px;background:#c7d0da;color:#fff}
.chip .no{font-size:11px;color:var(--sub);font-weight:800;min-width:14px;text-align:right}
.chip.on .no{color:#b3bfcb}

.done{text-align:center;background:linear-gradient(135deg,#fff6d4,#ffe3ef);border:2px solid #ffc93c}
.done h2{margin:6px 0}

/* 게임 느낌의 알림창 */
.modal{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:20px;
  background:rgba(10,40,70,.6);backdrop-filter:blur(3px)}
.mbox{width:100%;max-width:340px;background:#fff;border:6px solid #15314a;border-radius:22px;
  box-shadow:0 10px 0 rgba(21,49,74,.35);text-align:center;overflow:hidden;animation:mpop .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes mpop{0%{transform:scale(.7) translateY(20px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.mbox .mtop{height:14px;background:repeating-linear-gradient(45deg,var(--mc),var(--mc) 12px,#15314a 12px,#15314a 24px)}
.mbox .minner{padding:20px 18px 18px}
.mbox .micon{width:74px;height:74px;margin:0 auto 10px;border:5px solid #15314a;border-radius:14px;background:var(--mc);
  display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.18);animation:bounce 1.1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.mbox h2{margin:4px 0 6px;font-size:21px;letter-spacing:-.02em}
.mbox p{margin:0;color:var(--sub);font-size:15px;word-break:keep-all;white-space:pre-line}
.mbox .mname{display:inline-block;margin-top:10px;font-weight:800;color:#15314a;background:#f1f6fa;
  border-radius:99px;padding:6px 14px;font-size:15px}
.mbox .btn{margin-top:16px;background:var(--mc);border:4px solid #15314a;box-shadow:0 5px 0 rgba(21,49,74,.35)}
.mbox .btn.ghost{margin-top:10px;background:#eef3f7;color:#5d6b82;border-color:#c9d6e2;box-shadow:0 4px 0 rgba(21,49,74,.18)}
.mbox .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(21,49,74,.35)}

.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-140px);background:#15314a;color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;z-index:60;transition:transform .35s;max-width:92vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.show{transform:translateX(-50%) translateY(0)}

.scanner{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
.scanner video{flex:1;width:100%;object-fit:cover}
.scanner .frame{position:absolute;left:50%;top:44%;width:64vmin;height:64vmin;transform:translate(-50%,-50%);border:4px solid #fff;border-radius:24px;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
.scanner .bar{position:absolute;left:0;right:0;bottom:0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));text-align:center;color:#fff}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;
  width:min(420px,92vw);box-shadow:0 8px 24px rgba(20,60,90,.3)}

/* 선생님 화면 */
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;border:0;border-radius:14px;padding:12px;font-size:15px;font-weight:800;font-family:inherit;
  background:#e6f3fb;color:#1c7ab5;cursor:pointer}
.tab.on{background:var(--brand);color:#fff}
.sumrow{display:flex;gap:10px;text-align:center}
.sum{flex:1;background:#f1f7fb;border-radius:14px;padding:10px 6px}
.sum b{display:block;font-size:22px;color:var(--brand)}
.sum span{font-size:12px;color:var(--sub);font-weight:700}
.btnrow{display:flex;gap:8px}
.btnrow .btn{margin-top:12px}
.rrow{background:#fff;border-radius:16px;padding:10px 14px;box-shadow:0 1px 3px rgba(20,60,90,.10);
  margin-bottom:8px;display:flex;align-items:center;gap:12px}
.rrow .rwho{min-width:104px}
.rrow .rid{font-size:12px;color:var(--sub);font-weight:700}
.rrow .rname{font-size:16px;font-weight:800}
.rrow .rmid{flex:1}
.rrow .rbar{height:10px;background:#e8eff5;border-radius:99px;overflow:hidden}
.rrow .rbar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ok),#5ed99b)}
.rrow .rcell{font-size:11px;color:var(--sub);font-weight:700;margin-top:4px}
.rrow .rcnt{font-weight:900;font-size:18px;color:var(--ok);white-space:nowrap}
.rrow.full{background:linear-gradient(135deg,#fff8dc,#ffeef5);box-shadow:0 0 0 2px #ffc93c inset}
.rrow.full .rcnt{color:#e8891a}
.empty{text-align:center;color:var(--sub);padding:30px 10px;font-size:14px;line-height:1.7}
.qrlist{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.qrbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;break-inside:avoid}
.qrbox img{width:100%;height:auto;image-rendering:pixelated}
.qrbox h3{margin:6px 0 2px;font-size:17px}
.qrbox code{font-size:10px;color:var(--sub);word-break:break-all}
@media print{
  body{background:#fff}.noprint{display:none!important}.wrap{max-width:none;padding:0}
  .qrlist{grid-template-columns:repeat(2,1fr);gap:0}
  .qrbox{border:1px dashed #999;border-radius:0;padding:20px;page-break-inside:avoid;height:48vh;display:flex;flex-direction:column;justify-content:center}
  .qrbox img{width:72%;margin:0 auto}.qrbox h3{font-size:24px}
}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- 게임 느낌의 알림창 -->
<div class="modal hidden" id="modal">
  <div class="mbox" id="mbox">
    <div class="mtop"></div>
    <div class="minner">
      <div class="micon" id="mIcon">!</div>
      <h2 id="mTitle"></h2>
      <p id="mText"></p>
      <div id="mExtra"></div>
      <div id="mName"></div>
      <button class="btn" id="mBtn">확인</button>
      <button class="btn ghost hidden" id="mBtn2">취소</button>
    </div>
  </div>
</div>

<div class="wrap" id="app">
  <!-- 로그인 -->
  <section id="loginView" class="hidden">
    <div class="hero"><small>2026 STEP-IN</small><h1 id="evtTitle"></h1></div>
    <div class="card">
      <div class="tabs">
        <button class="tab on" id="tabReg">처음이에요<br><span style="font-weight:600;font-size:11px">학생 등록하기</span></button>
        <button class="tab" id="tabLogin">이미 등록했어요<br><span style="font-weight:600;font-size:11px">로그인</span></button>
      </div>
      <p class="muted" id="loginHelp" style="margin:0"></p>
      <p class="hidden" id="pendingMsg" style="margin:10px 0 0;color:var(--brand);font-weight:800"></p>

      <label for="sid">학번</label>
      <input id="sid" inputmode="numeric" autocomplete="off" placeholder="예) 10315">
      <label for="sname">이름</label>
      <input id="sname" autocomplete="off" placeholder="예) 홍길동">
      <label for="spin">비밀번호 (숫자 4자리)</label>
      <input id="spin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">
      <div id="pin2Wrap">
        <label for="spin2">비밀번호 확인</label>
        <input id="spin2" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">
      </div>
      <div class="err" id="loginErr"></div>
      <button class="btn" id="loginBtn">등록하고 시작하기</button>
      <p class="muted" style="margin:12px 0 0;font-size:13px">비밀번호는 휴대폰이 꺼지거나 바뀌었을 때 내 도장판을 다시 불러오는 데 써요. 잊지 않게 기억해 두세요.</p>
    </div>
  </section>

  <!-- 게임판 -->
  <section id="boardView" class="hidden">
    <div class="topbar">
      <div><span class="muted" id="whoId"></span> <b id="whoName"></b>
        <div class="progress" style="width:150px"><i id="bar"></i></div>
      </div>
      <div class="cnt" id="count"></div>
    </div>

    <div class="card done hidden" id="doneCard">
      <div style="font-size:44px">🎉</div>
      <h2>미션 클리어!</h2>
      <p style="margin:0" id="doneMsg"></p>
    </div>

    <div class="board" id="board">
      <img class="bg" id="boardImg" alt="스탬프 게임판">
    </div>

    <div class="card" style="margin-top:12px">
      <b style="font-size:15px" id="chipTitle">부스 현황</b>
      <div class="chips" id="chips"></div>
      <button class="btn ghost small hidden" id="myQrBtn" style="margin-top:14px">🎫 본부 확인용 QR 보기</button>
      <button class="btn ghost small hidden" id="logoutBtn">학번·이름 다시 입력하기</button>
    </div>
    <div style="height:70px"></div>
    <button class="btn fab" id="scanBtn">📷 부스 QR 찍기</button>
  </section>
</div>

<div class="scanner hidden" id="scanner">
  <video id="video" playsinline muted></video>
  <div class="frame"></div>
  <canvas id="canvas" class="hidden"></canvas>
  <div class="bar">
    <p id="scanTip" style="margin:0 0 10px;font-weight:800">네모 안에 부스 QR을 맞춰 주세요</p>
    <button class="btn ghost" id="closeScan" style="margin:0">닫기</button>
  </div>
</div>

const BOARD = { w:1080, h:2800, stamp:210 };
const CELLS = {
  1:[365,512],   2:[703,512],   3:[878,685],   4:[876,858],   5:[365,858],
  6:[190,858],   7:[192,1200],  8:[365,1200],  9:[535,1200],  10:[876,1200],
  11:[876,1378], 12:[874,1550], 13:[704,1550], 14:[190,1550], 15:[190,1727],
  16:[365,1900], 17:[876,1900], 18:[876,2072], 19:[876,2248], 20:[704,2248],
  21:[535,2248], 22:[365,2248], 23:[190,2248],
};

const KEY = "kstemStamp_v2";
const $ = id => document.getElementById(id);

function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||{} }catch(e){ return {} } }
function save(s){
  try{ localStorage.setItem(KEY, JSON.stringify(s)) }catch(e){}
  try{ document.cookie = KEY+"="+encodeURIComponent(JSON.stringify(s))+";max-age=31536000;path=/;SameSite=Lax" }catch(e){}
}
function loadCookie(){
  try{ const m=document.cookie.match(new RegExp("(?:^|; )"+KEY+"=([^;]*)")); return m?JSON.parse(decodeURIComponent(m[1])):null }catch(e){ return null }
}
let state = load();
if(!state.user){ const c=loadCookie(); if(c&&c.user){ state=c; save(state) } }
state.stamps = state.stamps || {};

function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2600);
}

/* 게임 느낌의 알림창 : type = warn(빨강) / info(파랑) / ok(초록) */
const MCOLOR = { warn:"#e8434d", info:"#2f9be0", ok:"#2bb673" };
function showModal({type="warn", icon="!", title="", text="", name="", html="", btn="확인", cancel="", onOk=null, onCancel=null}){
  $("mbox").style.setProperty("--mc", MCOLOR[type]||MCOLOR.warn);
  $("mIcon").textContent = icon;
  $("mTitle").textContent = title;
  $("mText").textContent = text;
  $("mExtra").innerHTML = html || "";
  $("mName").innerHTML = name ? `<span class="mname">${name}</span>` : "";
  $("mBtn").textContent = btn;
  $("mBtn").onclick = () => { closeModal(); if(onOk) onOk(); };
  $("mBtn2").classList.toggle("hidden", !cancel);
  $("mBtn2").textContent = cancel || "취소";
  $("mBtn2").onclick = () => { closeModal(); if(onCancel) onCancel(); };
  $("modal").dataset.locked = cancel ? "1" : "";
  $("modal").classList.remove("hidden");
  if(navigator.vibrate) navigator.vibrate(type==="warn" ? [90,60,90] : 60);
}
function closeModal(){ $("modal").classList.add("hidden") }

const boothByCode = c => CONFIG.booths.find(b=>b.code.toLowerCase()===(c||"").trim().toLowerCase());
function codeFromText(t){
  try{ const u=new URL(t); return u.searchParams.get("booth")||(u.hash.match(/booth=([^&]+)/)||[])[1]||"" }catch(e){ return t }
}
const baseUrl = () => location.origin + location.pathname;
const cleanUrl = () => { try{ history.replaceState(null,"",location.pathname) }catch(e){} };
const fmtTime = ts => new Date(ts).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});

/* 도장이 찍힐 칸 번호 정하기
   - "visit" : 찍은 순서대로 1번 칸부터 차례로   - "fixed" : 부스마다 정해진 칸 */
const CELL_ORDER = Object.keys(CELLS).map(Number).sort((a,b)=>a-b);
function nextCell(){
  const used = Object.values(state.stamps).map(v=>v.cell);
  return CELL_ORDER.find(n => !used.includes(n)) || null;
}
function cellOf(b){
  const rec = state.stamps[b.code];
  return rec ? rec.cell : (CONFIG.stampOrder==="fixed" ? b.cell : null);
}

function buildBoard(){ $("boardImg").src = BOARD_IMG; }

/* 찍힌 도장들을 게임판 위에 다시 그리기 */
function drawStamps(popCode){
  $("board").querySelectorAll(".slot").forEach(el=>el.remove());
  const sz = BOARD.stamp;
  CONFIG.booths.forEach(b=>{
    if(!state.stamps[b.code]) return;
    const cell = cellOf(b), p = CELLS[cell]; if(!p) return;
    const d = document.createElement("div");
    d.className = "slot on" + (b.code===popCode ? " pop" : "");
    d.id = "slot-"+b.code;
    d.style.left   = ((p[0]-sz/2)/BOARD.w*100)+"%";
    d.style.top    = ((p[1]-sz/2)/BOARD.h*100)+"%";
    d.style.width  = (sz/BOARD.w*100)+"%";
    d.style.height = (sz/BOARD.h*100)+"%";
    d.innerHTML = `<div class="st">` +
      `<img src="${b.img || STAMP_IMG}" alt="${b.name} 도장">` +
      `</div>`;
    $("board").appendChild(d);
  });
}

function stamp(code){
  const b = boothByCode(code);
  if(!b){
    showModal({ type:"warn", icon:"?", title:"알 수 없는 QR이에요",
      text:"이 행사의 부스 QR이 아니에요. 부스에 붙어 있는 QR을 찍어 주세요." });
    return;
  }
  if(state.stamps[b.code]){                    // 같은 부스 QR을 또 찍은 경우
    const r = state.stamps[b.code];
    showModal({ type:"warn", icon:"!", title:"이미 찍은 QR이에요!",
      text:`이 부스 도장은 ${fmtTime(r.t)}에 ${r.cell}번 칸에 찍었어요.\n아직 안 간 부스로 가 볼까요?`,
      name:b.name, btn:"알겠어요" });
    return;
  }
  showModal({ type:"info", icon:"?", title:"미션을 완료했나요?",
    text:"이 부스의 활동을 모두 마쳤다면 도장을 받으세요.\n도장은 한 번만 받을 수 있어요.",
    name:b.name, btn:"네, 도장 받기", cancel:"아직이에요",
    onOk:()=>doStamp(b) });
}

function doStamp(b){
  if(state.stamps[b.code]) return;                    // 혹시 모를 중복 방지
  const cell = (CONFIG.stampOrder==="fixed") ? b.cell : nextCell();
  if(!cell){
    showModal({ type:"info", icon:"★", title:"빈 칸이 없어요",
      text:"게임판이 이미 꽉 찼어요. 본부석 선생님께 보여 주세요." });
    return;
  }
  state.stamps[b.code] = { t:Date.now(), cell };
  save(state); render(b.code); syncPush();
  const left = CONFIG.booths.length - Object.keys(state.stamps).length;
  if(left===0){
    setTimeout(()=>showModal({ type:"ok", icon:"★", title:"MISSION COMPLETE!",
      text:"모든 부스를 다 돌았어요!\n이 화면을 본부석 선생님께 보여 주세요.",
      name:`${state.user.id} ${state.user.name}`, btn:"야호!" }), 900);
  } else {
    toast(`⭐ ${cell}번 칸에 도장 획득! (${left}개 남음)`);
  }
  if(navigator.vibrate) navigator.vibrate([40,40,90]);
  const el = $("slot-"+b.code);
  if(el) setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"center"}),150);
}

function render(popCode){
  $("evtTitle").textContent = CONFIG.title;
  const logged = !!state.user;
  $("loginView").classList.toggle("hidden", logged);
  $("boardView").classList.toggle("hidden", !logged);

  $("bar").style.width = (got/total*100)+"%";

      ${r ? `<span class="tag">완료</span>` : ""}

  }).join("");
  $("chipTitle").innerHTML = `부스 현황 <span style="color:var(--ok)">${got}곳 완료</span> <span class="muted" style="font-weight:600">· 남은 곳 ${total-got}</span>`;
  const done = got===total;
  $("doneCard").classList.toggle("hidden", !done);
  if(done) $("doneMsg").innerHTML = `<b>${state.user.id} ${state.user.name}</b><br>${CONFIG.finishMessage}`;
}

function startSession(u, restored){
  state.user = { id:u.id, name:u.name, pin:u.pin, at:Date.now() };
  if(restored) state.stamps = restored;
  const pending = state.pending; delete state.pending;
  save(state); render(); syncPush();
  const got = myCount();
  toast(got ? `${u.name} 학생, 도장 ${got}개를 불러왔어요!` : `${u.name} 학생, 환영해요! 👋`);
  if(pending) setTimeout(()=>stamp(pending), 700);
}
function codesToStamps(codes){
  const out = {};
  String(codes||"").split(",").filter(Boolean).forEach(pair=>{
    const [code, cell] = pair.split("@");
    if(boothByCode(code)) out[code] = { t:Date.now(), cell:+cell||0 };
  });
  return out;
}

/* 카메라 스캐너 */
let stream=null, scanning=false, scanMode="booth";
async function openScanner(mode){
  scanMode = mode;
  try{ stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false}) }
  catch(e){ toast("카메라를 열 수 없어요. 휴대폰 기본 카메라로 찍어 주세요."); return }
  const v=$("video"); v.srcObject=stream; await v.play();
  $("scanTip").textContent = mode==="student" ? "학생 휴대폰의 '본부 확인용 QR'을 맞춰 주세요" : "네모 안에 부스 QR을 맞춰 주세요";
  $("scanner").classList.remove("hidden"); scanning=true; requestAnimationFrame(tick);
}
$("scanBtn").onclick = () => openScanner("booth");
function stopScan(){ scanning=false; $("scanner").classList.add("hidden");
  if(stream) stream.getTracks().forEach(t=>t.stop()); stream=null }
$("closeScan").onclick = stopScan;
function tick(){
  if(!scanning) return;
  const v=$("video"), c=$("canvas");
  if(v.readyState===v.HAVE_ENOUGH_DATA){
    const w=480, h=Math.round(v.videoHeight*(w/v.videoWidth));
    c.width=w; c.height=h;
    const ctx=c.getContext("2d",{willReadFrequently:true});
    ctx.drawImage(v,0,0,w,h);
    const img=ctx.getImageData(0,0,w,h);
    const r=jsQR(img.data,w,h,{inversionAttempts:"dontInvert"});
    if(r&&r.data){
      if(scanMode==="student"){ if(addStudentQr(r.data)) return; }
      else { stopScan(); stamp(codeFromText(r.data)); return; }
    }
  }
  requestAnimationFrame(tick);
}

/* ===================== 본부 집계 =====================
   (1) 구글 시트 연동 : CONFIG.syncUrl 을 넣으면 학생이 도장을 찍을 때마다 자동 전송
   (2) 본부 스캔     : 학생 화면의 '본부 확인용 QR'을 본부 기기로 찍어서 명단에 추가
   ==================================================== */
const ROSTER_KEY = "kstemRoster_v1", QUEUE_KEY = "kstemQueue_v1", SYNC_KEY = "kstemSyncUrl";
function syncUrl(){ try{ return localStorage.getItem(SYNC_KEY) || CONFIG.syncUrl || "" }catch(e){ return CONFIG.syncUrl||"" } }
function setSyncUrl(u){ try{ localStorage.setItem(SYNC_KEY, u||"") }catch(e){} }
const myCount = () => Object.keys(state.stamps).length;
const myCell  = () => Math.max(0, ...Object.values(state.stamps).map(v=>v.cell));

function api(params){
  const qs = new URLSearchParams(params).toString();
  return fetch(syncUrl() + "?" + qs, { cache:"no-store" })
    .then(r => r.json())
    .catch(() => jsonp(params));
}
function jsonp(params){
  return new Promise((resolve, reject) => {
    const cb = "kscb" + Date.now() + Math.floor(Math.random()*1000);
    const s = document.createElement("script");
    const done = ok => { try{ delete window[cb] }catch(e){} s.remove(); };
    window[cb] = d => { done(); resolve(d); };
    s.onerror = () => { done(); reject(new Error("network")); };
    s.src = syncUrl() + "?" + new URLSearchParams({...params, callback:cb}).toString();
    document.head.appendChild(s);
    setTimeout(() => { if(window[cb]){ done(); reject(new Error("timeout")); } }, 12000);
  });
}
function myCodes(){
  return Object.entries(state.stamps).sort((a,b)=>a[1].cell-b[1].cell)
    .map(([code,v]) => code + "@" + v.cell).join(",");
}
function myRecord(){
  return { action:"sync", id:state.user.id, name:state.user.name, pin:state.user.pin||"",
           count:myCount(), cell:myCell(), codes:myCodes(), t:Date.now() };
}
function syncPush(){
  if(!syncUrl() || !state.user) return;
  const q = JSON.parse(localStorage.getItem(QUEUE_KEY)||"[]");
  q.push(myRecord());
  localStorage.setItem(QUEUE_KEY, JSON.stringify(q.slice(-50)));
  flushQueue();
}
function flushQueue(){
  if(!syncUrl()) return;
  let q = JSON.parse(localStorage.getItem(QUEUE_KEY)||"[]");
  if(!q.length) return;
  const rec = q[q.length-1];                       // 최신 상태만 보내면 충분
  fetch(syncUrl(), { method:"POST", mode:"no-cors",
    headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(rec) })
    .then(()=>localStorage.setItem(QUEUE_KEY,"[]"))
    .catch(()=>{});
}

function roundRect(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
/* label 을 주면 QR 한가운데에 번호를 찍어요 (오류 복원 수준을 H로 올려서 그래도 읽혀요) */
function qrImg(text, label){
  const q = qrcode(0, label ? "H" : "M");
  q.addData(text); q.make();
  const n = q.getModuleCount(), quiet = 4, sc = 10, size = (n + quiet*2) * sc;
  const c = document.createElement("canvas"); c.width = c.height = size;
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, size, size);
  g.fillStyle = "#000";
  for(let r=0;r<n;r++) for(let col=0;col<n;col++)
    if(q.isDark(r,col)) g.fillRect((col+quiet)*sc, (r+quiet)*sc, sc, sc);
  if(label){
    const w = Math.round(size*0.26), x = Math.round((size-w)/2), rad = w*0.2;
    g.fillStyle = "#fff"; roundRect(g,x,x,w,w,rad); g.fill();
    g.lineWidth = Math.max(3, size*0.012); g.strokeStyle = "#15314a";
    roundRect(g,x,x,w,w,rad); g.stroke();
    g.fillStyle = "#15314a"; g.textAlign = "center"; g.textBaseline = "middle";
    const fs = String(label).length > 2 ? w*0.38 : w*0.6;
    g.font = `900 ${fs}px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif`;
    g.fillText(String(label), size/2, size/2 + w*0.03);
  }
  return c.toDataURL("image/png");
}

(function init(){
  const params=new URLSearchParams(location.search);
  if(params.get("s")) setSyncUrl(params.get("s"));      // QR에 담겨 온 본부 연동 주소
  /* 비상용 : 주소 뒤에 ?backup 을 붙이면 'QR로 직접 확인' 기능이 나타나요.
     (학교 방화벽이 구글 시트 전송만 막는 경우를 대비한 예비 수단이에요) */
  /* 학번을 잘못 입력했을 때만 : 주소 뒤에 ?reset 을 붙이면 다시 입력 버튼이 나타나요 */
  if(params.has("reset")){ const el=$("logoutBtn"); if(el) el.classList.remove("hidden"); }
  try{
    if(params.has("backup")) localStorage.setItem("kstemBackup","1");
    if(localStorage.getItem("kstemBackup")==="1"){
      ["myQrBtn","adminScanBtn"].forEach(id=>{ const el=$(id); if(el) el.classList.remove("hidden") });
    }
  }catch(e){}
  buildBoard();
  if(params.has("preview")){          // 도장 위치 확인용 (기록은 저장되지 않음)
    state={user:{id:"0000",name:"미리보기"},stamps:{}};
    CONFIG.booths.forEach((b,i)=>{
      state.stamps[b.code] = { t:Date.now(), cell:(CONFIG.stampOrder==="fixed"? b.cell : CELL_ORDER[i]) };
    });
    render(); toast("도장 위치 미리보기 (저장되지 않아요)"); return;
  }
  const code=params.get("booth")||(location.hash.match(/booth=([^&]+)/)||[])[1];
  render(); flushQueue();
  if(code){
    cleanUrl();
    if(state.user) stamp(code);
    else if(boothByCode(code)){ state.pending=code; save(state); render() }
    else showModal({ type:"warn", icon:"?", title:"알 수 없는 QR이에요",
        text:"이 행사의 부스 QR이 아니에요. 부스에 붙어 있는 QR을 찍어 주세요." });
  }
})();
</script>
